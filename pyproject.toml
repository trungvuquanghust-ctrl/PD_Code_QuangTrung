[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tim-2026"
version = "1.0.0"
description = "Clean reference implementation of PECT for partial-discharge few-shot learning"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
# requirements.txt is the single dependency source for this release.

[tool.setuptools.packages.find]
include = ["tim_2026*", "data_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
